name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          echo "Found: $ZIP"
          mkdir -p android-project
          unzip -o "$ZIP" -d android-project

      - name: Find Gradle project
        run: |
          GRADLE_DIR=$(find android-project -name "gradlew" -type f | head -n 1 | xargs -r dirname)
          if [ -z "$GRADLE_DIR" ]; then
            echo "gradlew not found"
            find android-project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x "$GRADLE_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyLive-4K-Wallpapers-APK
          path: "**/build/outputs/apk/**/*.apk"
