name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SkyLive4KWallpapers-mobile-build-ready.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Android project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q "SkyLive4KWallpapers-mobile-build-ready.zip" -d build-project

      - name: Build Debug APK
        working-directory: build-project/SkyLive4KWallpapers
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyLive4KWallpapers-APK
          path: build-project/SkyLive4KWallpapers/app/build/outputs/apk/debug/app-debug.apk
